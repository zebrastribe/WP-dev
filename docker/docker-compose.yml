# WordPress files for this clone: repo-root `wordpress/` → /var/www/html.
# Isolation: `wp-dev` runs `docker compose -p <id>` using `project` (or `local.composeProjectName`) from wp-dev.config.json so volumes/containers do not clash across clones.
#
# MySQL 8 defaults to caching_sha2_password; the official wordpress:cli image does not load that
# plugin cleanly for `wp db import`. Use mysql_native_password for new DB volumes (see docker/.env.example).
#
# Network configuration: `wp-dev up` sets WPDEV_NETWORK_SUBNET, WPDEV_NETWORK_GATEWAY, and
# WPDEV_SSL_PROXY_IP by detecting an available subnet and deriving the gateway. Two stacks
# on one host get unique subnets automatically.
services:
  db:
    image: mysql:8.0
    command:
      - mysqld
      - --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    networks:
      - wpdev
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  wordpress:
    image: wordpress:php${WPDEV_PHP_VERSION:-8.2}-apache
    restart: unless-stopped
    networks:
      - wpdev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # WP_BIND controls the bind address (127.0.0.1 = localhost only, 0.0.0.0 = all interfaces).
      # Defaults to 127.0.0.1 (secure). wp-dev up normalizes and validates the value.
      - "${WP_BIND:-127.0.0.1}:${WP_PORT:-8888}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      # Do NOT pass WPDEV_ADMIN_SAVE_TOKEN here — a compromised plugin could read the env.
      # api.php loads the token from the bind-mounted docker/.env file instead.
      WPDEV_IMPORT_TOKEN: ${WPDEV_IMPORT_TOKEN:-}
      # Gate 0 security: trusted gateway for Docker network. Set by wp-dev up from actual network.
      # Empty = fail closed (no auto-unlock until wp-dev up runs).
      WPDEV_ADMIN_TRUSTED_GATEWAY: ${WPDEV_ADMIN_TRUSTED_GATEWAY:-}
      # Gate 0 defense-in-depth: 1 if WP port is bound to 127.0.0.1 only.
      # Empty/0 = fail closed. Derived from WP_BIND by wp-dev up.
      WPDEV_WP_BIND_LOCAL: ${WPDEV_WP_BIND_LOCAL:-}
    volumes:
      # Absolute host paths (WPDEV_HOST_PROJECT_ROOT) so compose from the terminal
      # container (docker.sock) does not resolve ../wordpress → /workspace/wordpress on the host.
      - ${WPDEV_HOST_PROJECT_ROOT:?WPDEV_HOST_PROJECT_ROOT required}/wordpress:/var/www/html
      # wp-dev admin: config + logs + .env only (never the whole docker/ tree — runners/scripts stay off-limits).
      - ${WPDEV_HOST_PROJECT_ROOT}/wp-dev.config.json:/wp-dev-repo/wp-dev.config.json:rw
      - ${WPDEV_HOST_PROJECT_ROOT}/logs:/wp-dev-repo/logs:rw
      - ${WPDEV_HOST_PROJECT_ROOT}/docker/.env:/wp-dev-repo/docker/.env:rw
      - ${WPDEV_HOST_PROJECT_ROOT}/docker/.env.example:/wp-dev-repo/docker/.env.example:ro
      - ${WPDEV_HOST_PROJECT_ROOT}/content-recovery-workspace/storage:/import-storage:rw
      - ${WPDEV_HOST_PROJECT_ROOT}/../knowledge-base:/workspace/knowledge-base:ro
      # Gate 0: restrict X-Forwarded-For trust. Generated by wp-dev up.
      - ${WPDEV_HOST_PROJECT_ROOT}/docker/remoteip.conf:/etc/apache2/conf-enabled/remoteip.conf:ro
    depends_on:
      db:
        condition: service_healthy

  local_ssl_proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      wpdev:
        # Fixed IP for remoteip.conf trust. Set by wp-dev up from WPDEV_SSL_PROXY_IP.
        # Omit ipv4_address when empty (profile only starts if WPDEV_SSL_PROXY_IP is set).
        ipv4_address: ${WPDEV_SSL_PROXY_IP:-}
    profiles: ["ssl"]
    depends_on:
      - wordpress
    ports:
      # SSL proxy also always binds to loopback.
      - "127.0.0.1:${WP_HTTPS_PORT:-8443}:443"
    volumes:
      - ${WPDEV_HOST_PROJECT_ROOT}/docker/nginx-local-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ${WPDEV_HOST_PROJECT_ROOT}/docker/certs:/certs:ro

  # Official `wordpress` image has no `wp` binary; wp-dev uses this service for WP-CLI.
  wpcli:
    image: wordpress:cli-php${WPDEV_PHP_VERSION:-8.2}
    user: "33:33"
    networks:
      - wpdev
    volumes:
      - ${WPDEV_HOST_PROJECT_ROOT}/wordpress:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
    depends_on:
      db:
        condition: service_healthy

  terminal:
    build:
      context: .
      dockerfile: terminal.Dockerfile
    restart: unless-stopped
    init: true
    networks:
      - wpdev
    ports:
      # Terminal and runner ports are ALWAYS bound to loopback (127.0.0.1).
      # These must never follow WP_BIND or be exposed beyond localhost.
      - "127.0.0.1:${WPDEV_TERMINAL_PORT:-7681}:7681"
      - "127.0.0.1:${WPDEV_TERMINAL_RUNNER_PORT:-7682}:7682"
      - "127.0.0.1:${WPDEV_HOST_RUNNER_PORT:-7683}:7683"
    environment:
      WPDEV_TERMINAL_AUTH: ${WPDEV_TERMINAL_AUTH:-wpdev:wpdev}
      WPDEV_TERMINAL_RUNNER_TOKEN: ${WPDEV_TERMINAL_RUNNER_TOKEN:-}
      WPDEV_TERMINAL_RUNNER_ORIGIN: ${WPDEV_TERMINAL_RUNNER_ORIGIN:-http://localhost:${WP_PORT:-8888}}
      WPDEV_TERMINAL_WORKDIR: ${WPDEV_TERMINAL_WORKDIR:-/workspace}
      # Fixed container listen ports; host publish ports are in ports: above.
      WPDEV_TERMINAL_RUNNER_PORT: "7682"
      WPDEV_HOST_RUNNER_PORT: "7683"
      # Host developer uid/gid so interactive ttyd can write the bind-mounted workspace
      # without running as root (docker CLI stays root-only; runners keep sock access).
      WPDEV_HOST_UID: ${WPDEV_HOST_UID:-}
      WPDEV_HOST_GID: ${WPDEV_HOST_GID:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - ${WPDEV_HOST_PROJECT_ROOT}:/workspace
      - ${WPDEV_HOST_HOME:?WPDEV_HOST_HOME required}/.ssh:/root/.ssh:ro
      - ${WPDEV_HOST_HOME}/.wp-dev:/root/.wp-dev
      # Sync runner (pull/push) needs the host Docker daemon for wp-cli compose exec.
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  # Network name: <compose-project>_wpdev (e.g., mysite_wpdev)
  wpdev:
    driver: bridge
    # Subnet/gateway set by wp-dev up. Fallback allows `docker compose down` with old .env.
    # The fallback 172.28.0.0/24 is used ONLY for migration; wp-dev up allocates properly.
    # Override: WPDEV_NETWORK_SUBNET, WPDEV_NETWORK_GATEWAY in docker/.env
    ipam:
      config:
        - subnet: ${WPDEV_NETWORK_SUBNET:-172.28.0.0/24}
          gateway: ${WPDEV_NETWORK_GATEWAY:-172.28.0.1}

volumes:
  db_data:
